[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
actix-web = "4.16.0"
serde_json = "1.0.154"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio","tls-native-tls","postgres","macros","chrono"]}
chrono = "0.4.45"